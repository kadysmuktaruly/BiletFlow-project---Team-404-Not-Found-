# CI for every pull request, whatever its base branch (stacked PRs target feature branches).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff, mypy, alembic check, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biletflow
          POSTGRES_PASSWORD: biletflow
          POSTGRES_DB: biletflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biletflow -d biletflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://biletflow:biletflow@localhost:5432/biletflow
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check (strict)
        run: uv run mypy .
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Models match migrations
        run: uv run alembic check
      # Uses its own biletflow_test database; includes tests/constraints/verify_constraints.sql.
      - name: Tests
        run: uv run pytest -q

  web:
    name: Web (eslint, i18n keys, tsc, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and check kk/ru/en message keys match
        run: npm run lint -w @biletflow/web
      - name: Type check
        run: npm run typecheck --workspaces --if-present
      - name: Production build (catches prerender errors)
        run: npm run build -w @biletflow/web

  api-types:
    name: API types match the OpenAPI schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gen:api-types
      - name: Fail if packages/api-types is stale
        run: |
          git diff --exit-code -- packages/api-types || {
            echo "::error::packages/api-types is out of date. Run 'npm run gen:api-types' and commit the result."
            exit 1
          }
