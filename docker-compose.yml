# Full local stack for BiletFlow: `docker compose up` starts db, api, web, mailpit and the
# Caddy HTTPS proxy, each with a health check. Open https://localhost:8443 (HTTPS_PORT).
# Demo data is seeded on start (SEED_DEMO_DATA=true). The plain ports stay published: the
# web app on :3000 and the API on :8000, which the scanner app uses over the LAN (see README).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biletflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biletflow}
      POSTGRES_DB: ${POSTGRES_DB:-biletflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biletflow} -d ${POSTGRES_DB:-biletflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Dev mail catcher. Every email the API sends lands here: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./apps/api
    # .env is optional so `docker compose up` works on a fresh clone.
    env_file:
      - path: .env
        required: false
    environment:
      # Container-to-container addresses override the host-facing values in .env.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-biletflow}:${POSTGRES_PASSWORD:-biletflow}@db:5432/${POSTGRES_DB:-biletflow}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Where email links and Campaign QR links point, and the web origin CORS allows. The
      # default is the Caddy HTTPS origin; an https:// value also makes the refresh cookie
      # Secure (COOKIE_SECURE unset). Override if you change HTTPS_PORT or use a LAN IP.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost:${HTTPS_PORT:-8443}}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # `next dev` fits a 2 GB Docker VM; `next build` doesn't. CI still runs the production
      # build, and `--target runtime` builds the production image (see apps/web/Dockerfile).
      target: ${WEB_BUILD_TARGET:-dev}
      args:
        # Baked into the browser bundle: the API as seen from the user's browser. Empty means
        # the page's own origin (/api/v1), which works both through Caddy and on :3000.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL-}
    environment:
      # Read by `next dev` at compile time (the production stage bakes it in as a build arg).
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL-}
      # On plain http://localhost:3000 the web app forwards /api/v1 to the API itself
      # (src/proxy.ts); through Caddy, /api never reaches the web app.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  # HTTPS reverse proxy (SRS 7, docs/https-proxy-proposal.md): one origin for web and API,
  # with a certificate from Caddy's local CA. Trust it once: `docker compose exec caddy
  # caddy trust`, or accept the browser warning.
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Keeps the local CA and certificate across restarts, so you trust it only once.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
